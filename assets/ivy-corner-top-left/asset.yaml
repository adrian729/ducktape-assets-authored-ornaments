id: ivy-corner-top-left
title: Ivy corner, top-left
description: A top-left corner in black penwork, drawn as two thin double rules meeting at the vertex, with an ivy vine winding down the vertical rule and along the horizontal one, pointed three-lobed ivy leaves with veined interiors, small curled tendrils and a fleur-de-lis finial capping each end of the rules, on a transparent background.
