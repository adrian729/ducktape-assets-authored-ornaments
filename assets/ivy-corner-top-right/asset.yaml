id: ivy-corner-top-right
title: Ivy corner, top-right
description: A top-right corner in black penwork, drawn as two thin double rules meeting at the vertex under a large curled acanthus leaf, with an ivy vine winding down the vertical rule and a shorter run of tendrils along the horizontal one, pointed ivy leaves with veined interiors, curled tendrils and a curled leaf closing each end of the rules, on a transparent background.
