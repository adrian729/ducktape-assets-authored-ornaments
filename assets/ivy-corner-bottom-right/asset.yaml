id: ivy-corner-bottom-right
title: Ivy corner, bottom-right
description: A bottom-right corner in black penwork, drawn as two thin double rules meeting at the vertex under a cluster of curled acanthus leaves, with an ivy vine climbing the vertical rule and running along the horizontal one, pointed ivy leaves with veined interiors, curled tendrils and a fleur-de-lis finial capping each end of the rules, on a transparent background.
type: corner
