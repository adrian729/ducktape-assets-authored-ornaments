title: Ruled ivy frame
description: A complete landscape rectangular frame in black penwork, a thin double rule on all four sides with an ivy vine of pointed three-lobed leaves and curled tendrils running along the outside of the rules, curled acanthus leaves and small finials at the four corners and a small ivy spray at the middle of the top and bottom rules, around a transparent opening, on a transparent background.
